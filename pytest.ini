"""
pytest configuration for integration tests
"""

[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    smoke: Quick smoke tests
    slow: Slow running tests
    integration: Integration tests
    unit: Unit tests
    alerts: Tests for alert functionality
    profile: Tests for profile functionality
    wishlist: Tests for wishlist functionality
    admin: Tests for admin functionality
    persistence: Tests for data persistence
    auth: Tests for authentication and auth changes
minversion = 6.0
